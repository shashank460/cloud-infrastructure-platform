name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloud-platform-api:${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ap-south-1 --name cloud-platform-dev
      - name: Create GHCR image pull secret
        run: |
          kubectl create namespace cloud-platform --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-credentials \
            --namespace cloud-platform \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Update image
        run: sed -i "s#ghcr.io/REPLACE_ME/cloud-platform-api:latest#ghcr.io/${{ github.repository_owner }}/cloud-platform-api:${{ github.sha }}#" k8s/deployment.yaml
      - name: Apply namespace first
        run: kubectl apply -f k8s/namespace.yaml
      - name: Apply application resources
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/pdb.yaml
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
      - name: Verify rollout
        run: kubectl rollout status deployment/cloud-platform-api -n cloud-platform --timeout=180s

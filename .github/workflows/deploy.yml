name: Build and Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloud-platform-api:${{ github.sha }}
  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ap-south-1 --name cloud-platform-dev
      - name: Update image and rollout
        run: |
          sed -i "s#ghcr.io/REPLACE_ME/cloud-platform-api:latest#ghcr.io/${{ github.repository_owner }}/cloud-platform-api:${{ github.sha }}#" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/cloud-platform-api -n cloud-platform --timeout=180s

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-platform-api
  namespace: cloud-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cloud-platform-api
  template:
    metadata:
      labels:
        app: cloud-platform-api
    spec:
      containers:
        - name: api
          image: ghcr.io/REPLACE_ME/cloud-platform-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: cloud-platform-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

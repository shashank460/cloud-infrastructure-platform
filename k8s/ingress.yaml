apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-platform-api
  namespace: cloud-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-platform-api
                port:
                  number: 80

# TLS should be enabled only after a real DNS name and certificate issuer are configured.
# Recommended production follow-up: cert-manager + Let's Encrypt (or AWS Load Balancer/ACM).

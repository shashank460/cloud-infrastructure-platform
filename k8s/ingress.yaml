apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-platform-api
  namespace: cloud-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-platform-api
                port:
                  number: 80
